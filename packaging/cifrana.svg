<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f7a6f"/>
      <stop offset="1" stop-color="#12564f"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="13" fill="url(#fundo)"/>

  <!-- braço do violão: cordas e trastes -->
  <g stroke="#eaf5f2" stroke-width="1.4" opacity="0.85" stroke-linecap="round">
    <line x1="14" y1="14" x2="14" y2="46"/>
    <line x1="21" y1="14" x2="21" y2="46"/>
    <line x1="28" y1="14" x2="28" y2="46"/>
  </g>
  <g stroke="#eaf5f2" stroke-width="1.4" opacity="0.55" stroke-linecap="round">
    <line x1="12" y1="21" x2="30" y2="21"/>
    <line x1="12" y1="30" x2="30" y2="30"/>
    <line x1="12" y1="39" x2="30" y2="39"/>
  </g>

  <!-- dedos do acorde -->
  <circle cx="14" cy="25.5" r="3.1" fill="#ffd166"/>
  <circle cx="21" cy="34.5" r="3.1" fill="#ffd166"/>
  <circle cx="28" cy="25.5" r="3.1" fill="#ffd166"/>

  <!-- nota musical, o lado "songbook" -->
  <g fill="#ffffff">
    <rect x="45" y="15" width="3" height="26" rx="1.5"/>
    <ellipse cx="42" cy="42" rx="6.2" ry="4.8" transform="rotate(-20 42 42)"/>
    <path d="M48 15c5 1.6 8.4 4.2 8.4 8.2 0 2.1-1 3.9-2.7 5.2.5-3.9-1.9-6.6-5.7-8.2z"/>
  </g>
</svg>
