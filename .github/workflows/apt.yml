name: repositorio-apt

# Publica um repositório APT no GitHub Pages com os .deb de todas as releases.
# Com ele, o Cifrana passa a ser atualizado pelo Gerenciador de Atualizações
# do Linux Mint, junto com o resto do sistema.
on:
  release:
    types: [published]
  workflow_run:
    workflows: ["release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write   # publica o repositório no branch "apt"
  pages: write      # e também no Pages, quando estiver ligado
  id-token: write

# uma publicação por vez, sem cancelar a que já está em andamento
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    # no encadeamento após a release, só segue se ela tiver dado certo
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      CHAVE_SECRETA: ${{ secrets.APT_GPG_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar as ferramentas de empacotamento
        run: sudo apt-get update -qq && sudo apt-get install -y dpkg-dev apt-utils

      - name: Baixar os .deb de todas as releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p debs
          for tag in $(gh release list --limit 100 --json tagName --jq '.[].tagName'); do
            gh release download "$tag" --pattern '*.deb' --dir debs --clobber || true
          done
          ls -l debs

      - name: Importar a chave de assinatura
        id: chave
        if: env.CHAVE_SECRETA != ''
        run: |
          printf '%s\n' "$CHAVE_SECRETA" | gpg --batch --quiet --import
          impressao="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')"
          echo "impressao=$impressao" >> "$GITHUB_OUTPUT"
          echo "chave $impressao importada"

      - name: Montar o repositório
        env:
          CHAVE_GPG: ${{ steps.chave.outputs.impressao }}
          URL_BASE: ${{ format('https://raw.githubusercontent.com/{0}/apt', github.repository) }}
        run: |
          bash packaging/build-apt-repo.sh debs site
          ls -l site

      # Publicação principal: um branch órfão só com os arquivos gerados.
      # O raw.githubusercontent serve esse branch por HTTPS, e é dele que o
      # apt lê — assim o repositório funciona sem depender do GitHub Pages,
      # que o token do Actions não consegue ligar sozinho.
      - name: Publicar no branch apt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd site
          git init -q -b apt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Repositório APT — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # sempre um commit só: o branch guarda o estado atual, não histórico
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apt
          echo "publicado em https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/apt/"

      # O Pages é um extra: dá uma URL mais bonita e uma página de instruções.
      # O token não consegue criá-lo, então aqui ele é opcional.
      - name: O GitHub Pages está ligado?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" >/dev/null 2>&1; then
            echo "ligado=true" >> "$GITHUB_OUTPUT"
          else
            echo "ligado=false" >> "$GITHUB_OUTPUT"
            echo "Pages desligado — publicando só no branch apt."
            echo "Para ligar: Settings > Pages > Source: GitHub Actions."
          fi

      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.ligado == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.ligado == 'true'
        with:
          path: site

      - uses: actions/deploy-pages@v4
        if: steps.pages.outputs.ligado == 'true'
