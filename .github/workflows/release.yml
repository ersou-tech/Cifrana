name: release

# Publica o .deb de duas formas:
#   - enviando uma tag:  git tag v0.1.0 && git push origin v0.1.0
#   - ou pela aba Actions > release > Run workflow, informando a versão
#     (nesse caso a tag é criada no commit atual, pelo próprio workflow)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão a publicar, com o v na frente (ex.: v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rodar os testes
        run: python3 -m unittest discover -s tests -t .

      - name: Montar o .deb
        run: ./packaging/build-deb.sh

      - name: Conferir a instalação
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ./dist/cifrana_*.deb
          cifrana --version

      - name: Publicar a release
        env:
          GH_TOKEN: ${{ github.token }}
          ENTRADA: ${{ inputs.versao }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # disparo manual usa a versão informada; push de tag usa a própria tag
          TAG="${ENTRADA:-$REF_NAME}"
          case "$TAG" in
            v*) ;;
            *) echo "A versão precisa começar com 'v' (recebi: $TAG)"; exit 1 ;;
          esac

          # no disparo manual a tag ainda não existe: criamos no commit atual
          ALVO=""
          [ -n "$ENTRADA" ] && ALVO="--target $GITHUB_SHA"

          cat > notas.md <<'EOF'
          ## Instalar no Linux Mint / Ubuntu

          Baixe o `.deb` aqui embaixo e clique duas vezes nele — o Instalador de
          Pacotes abre e você só confirma. Pelo terminal dá na mesma:

          ```bash
          sudo apt install ./cifrana_*.deb
          ```

          O `apt` puxa o `python3-tk` sozinho. Depois é só procurar por
          **Cifrana** no menu iniciar.

          Para desinstalar: `sudo apt remove cifrana`.

          ## Outros sistemas

          O código é Python puro (3.9+), sem dependências além da biblioteca
          padrão: `python3 -m cifrana --gui` abre a interface e
          `python3 -m cifrana --help` mostra as opções de terminal.
          EOF

          gh release create "$TAG" dist/*.deb $ALVO \
            --title "Cifrana $TAG" \
            --notes-file notas.md \
            || gh release upload "$TAG" dist/*.deb --clobber
